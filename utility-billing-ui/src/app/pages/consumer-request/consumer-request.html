<div class="layout centered">
  <div class="auth-card wide">
    <div class="auth-header">
      <h2>Create Consumer Request</h2>
      <p>Submit your details below to register as a new consumer in our system.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">

      <div class="input-group">
        <label>Full Name</label>
        <input type="text" placeholder="e.g. Ravi Kumar" formControlName="fullName"
          [class.invalid]="form.get('fullName')?.touched && form.get('fullName')?.invalid" />
        <span class="error-text" *ngIf="form.get('fullName')?.touched && form.get('fullName')?.invalid">
          Full name must be at least 3 characters
        </span>
      </div>

      <div class="form-grid">
        <div class="input-group">
          <label>Email Address</label>
          <input type="email" placeholder="ravi@gmail.com" formControlName="email"
            [class.invalid]="form.get('email')?.touched && form.get('email')?.invalid" />
          <span class="error-text" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
            Enter a valid email address
          </span>
        </div>

        <div class="input-group">
          <label>Phone Number</label>
          <input type="text" placeholder="9876543210" formControlName="phone"
            [class.invalid]="form.get('phone')?.touched && form.get('phone')?.invalid" />
          <span class="error-text" *ngIf="form.get('phone')?.touched && form.get('phone')?.invalid">
            Enter a valid 10-digit mobile number
          </span>
        </div>
      </div>

      <div class="input-group">
        <label>Address</label>
        <input type="text" placeholder="Flat 305, Sundae Stories" formControlName="addressLine1"
          [class.invalid]="form.get('addressLine1')?.touched && form.get('addressLine1')?.invalid" />
        <span class="error-text" *ngIf="form.get('addressLine1')?.touched && form.get('addressLine1')?.invalid">
          Address is required
        </span>
      </div>

      <div class="form-grid tri">
        <div class="input-group">
          <label>City</label>
          <input type="text" placeholder="Hyderabad" formControlName="city"
            [class.invalid]="form.get('city')?.touched && form.get('city')?.invalid" />
          <span class="error-text" *ngIf="form.get('city')?.touched && form.get('city')?.invalid">
            City is required
          </span>
        </div>

        <div class="input-group">
          <label>State</label>
          <input type="text" placeholder="Telangana" formControlName="state"
            [class.invalid]="form.get('state')?.touched && form.get('state')?.invalid" />
          <span class="error-text" *ngIf="form.get('state')?.touched && form.get('state')?.invalid">
            State is required
          </span>
        </div>

        <div class="input-group">
          <label>Postal Code</label>
          <input type="text" placeholder="500081" formControlName="postalCode"
            [class.invalid]="form.get('postalCode')?.touched && form.get('postalCode')?.invalid" />
          <span class="error-text" *ngIf="form.get('postalCode')?.touched && form.get('postalCode')?.invalid">
            Enter a valid 6-digit code
          </span>
        </div>
      </div>

      <div class="actions-row">
        <button type="submit" class="confirm-btn" [disabled]="form.invalid || loading">
          {{loading ? 'Submitting...' : 'Submit Request'}}
        </button>
      </div>

    </form>
  </div>
</div>
