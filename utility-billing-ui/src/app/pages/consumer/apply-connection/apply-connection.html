<div class="layout">
  <main class="content">
    <div class="header">
      <h2>Apply for Connection</h2>
    </div>

    <div class="form-card">
      <div class="form-grid">
        <div class="input-group">
          <label>Utility Type</label>
          <select [(ngModel)]="form.utilityType" [disabled]="loading">
            <option value="ELECTRICITY">Electricity</option>
            <option value="WATER">Water</option>
            <option value="GAS">Gas</option>
          </select>
        </div>

        <div class="input-group">
          <label>Tariff Plan</label>
          <select [(ngModel)]="form.tariffPlan" [disabled]="loading">
            <option value="DOMESTIC">Domestic</option>
            <option value="COMMERCIAL">Commercial</option>
            <option value="INDUSTRIAL">Industrial</option>
          </select>
        </div>
      </div>

      <button class="confirm-btn" (click)="apply()" [disabled]="loading">
        {{ loading ? 'Submitting...' : 'Submit Request' }}
      </button>
    </div>

    <div class="header section-header">
      <h3 class="section-title">My Applications</h3>
      <div class="controls">
        <select [(ngModel)]="utilityFilter" (change)="applyFilter()">
          <option value="">All Utilities</option>
          <option value="ELECTRICITY">Electricity</option>
          <option value="WATER">Water</option>
          <option value="GAS">Gas</option>
        </select>
      </div>
    </div>

    <div class="empty-state" *ngIf="filteredApplications.length === 0">
      <div class="empty-icon">📝</div>
      <p>No applications found for the selected criteria.</p>
    </div>

    <div class="cards">
      <div class="bill-card" *ngFor="let a of filteredApplications">
        <div class="top">
          <strong>{{ a.utilityType }}</strong>
          <span class="badge" [ngClass]="a.status.toLowerCase()">
            {{ a.status }}
          </span>
        </div>
        <div class="meta">
          <span>Plan: {{ a.tariffPlan }}</span>
          <span>Applied: {{ a.createdAt | date:'mediumDate' }}</span>
        </div>
        <div class="details" *ngIf="a.remarks">
          <p class="small">Note: {{ a.remarks }}</p>
        </div>
      </div>
    </div>
  </main>
</div>
