<div class="layout" [class.sidebar-collapsed]="isSidebarCollapsed">
  <app-consumer-sidebar #sidebar (sidebarToggle)="onSidebarToggle($event)"></app-consumer-sidebar>

  <main class="content">

    <div class="dashboard-header">
      <h2>My Connections</h2>
      <span class="date-display">{{ today | date:'fullDate' }}</span>
    </div>

    <div class="filters">
      <input type="text" placeholder="Search by meter number / utility / plan" [(ngModel)]="search" />
    </div>

    <div class="connections-grid">
      <div class="connection-card" *ngFor="let m of filteredMeters">
        <div class="card-header">
          <h4>{{ m.utilityType }}</h4>
          <span class="status" [class.active]="m.active" [class.inactive]="!m.active">
            {{ m.active ? 'Active' : 'Inactive' }}
          </span>
        </div>

        <div class="info-row">
          <span>Meter Number</span>
          <strong>{{ m.meterNumber }}</strong>
        </div>

        <div class="info-row">
          <span>Tariff Plan</span>
          <strong>{{ m.tariffPlan }}</strong>
        </div>

        <div class="info-row">
          <span>Last Reading</span>
          <strong>{{ m.lastReading }}</strong>
        </div>

        <div class="info-row">
          <span>Installed On</span>
          <strong>{{ m.installationDate | date:'mediumDate' }}</strong>
        </div>
      </div>
    </div>
  </main>
</div>
