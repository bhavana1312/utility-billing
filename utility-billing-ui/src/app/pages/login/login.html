<div class="container">
  <div class="card auth-card">
    <h2>Welcome back</h2>

    <form [formGroup]="form" (ngSubmit)="submit()">

      <input placeholder="Username" formControlName="username" />
      <div class="error" *ngIf="form.get('username')?.touched && form.get('username')?.invalid">
        Username is required
      </div>

      <div class="password-field">
        <input [type]="showPassword ? 'text' : 'password'" placeholder="Password" formControlName="password" />
        <button type="button" class="toggle" (click)="showPassword=!showPassword">
          {{ showPassword ? 'Hide' : 'Show' }}
        </button>
      </div>

      <div class="error" *ngIf="form.get('password')?.touched && form.get('password')?.invalid">
        Password is required
      </div>

      <div class="forgot-row">
        <a routerLink="/forgot-password">Forgot password?</a>
      </div>

      <button type="submit" [disabled]="form.invalid || loading">
        {{ loading ? 'Logging in...' : 'Login' }}
      </button>

    </form>
  </div>
</div>
