<div class="layout">

  <main class="content">
    <h2>Bills</h2>

    <div class="filters">
      <select [(ngModel)]="status" (change)="onFilterChange()">
        <option value="">Status</option>
        <option *ngFor="let s of statuses" [value]="s">{{ s }}</option>
      </select>

      <select [(ngModel)]="utility" (change)="applyFilters()">
        <option value="">Utility</option>
        <option *ngFor="let u of utilities" [value]="u">{{ u }}</option>
      </select>

      <select [(ngModel)]="tariffPlan" (change)="applyFilters()">
        <option value="">Plan</option>
        <option *ngFor="let p of tariffPlans" [value]="p">{{ p }}</option>
      </select>
    </div>



    <table>
      <thead>
        <tr>
          <th>Bill ID</th>
          <th>Consumer</th>
          <th>Utility</th>
          <th>Plan</th>
          <th>Units</th>
          <th>Total (₹)</th>
          <th>Status</th>
          <th>Generated</th>
          <th>Due Date</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let b of filtered">
          <td data-label="Bill ID">{{b.billId}}</td>
          <td data-label="Consumer">
            <strong>{{b.consumerName}}</strong><br>
            <span class="email">{{b.email}}</span>
          </td>
          <td data-label="Utility">{{b.utilityType}}</td>
          <td data-label="Plan">{{b.tariffPlan}}</td>
          <td data-label="Units">{{b.unitsConsumed}}</td>
          <td data-label="Total (₹)">{{b.totalAmount}}</td>
          <td data-label="Status">
            <span class="badge" [ngClass]="b.status.toLowerCase()">
              {{b.status}}
            </span>
          </td>
          <td data-label="Generated">{{b.generatedAt | date:'medium'}}</td>
          <td data-label="Due Date">{{b.dueDate | date:'mediumDate'}}</td>
        </tr>
      </tbody>
    </table>
    <div class="pagination">
      <button class="nav" (click)="prevPage()" [disabled]="page === 0">
        ‹
      </button>

      <button *ngFor="let p of [].constructor(totalPages); let i = index" class="page" [class.active]="i === page"
        (click)="loadBills(i)">
        {{ i + 1 }}
      </button>

      <button class="nav" (click)="nextPage()" [disabled]="page + 1 === totalPages">
        ›
      </button>
    </div>

  </main>
</div>
