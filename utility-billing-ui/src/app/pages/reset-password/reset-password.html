<div class="container">
  <div class="card auth-card">
    <h2>Reset Password</h2>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="password-field">
        <input [type]="showPassword ? 'text' : 'password'" placeholder="New Password" formControlName="newPassword"
          (input)="checkStrength()" />
        <button type="button" class="toggle" (click)="showPassword=!showPassword">
          {{ showPassword ? 'Hide' : 'Show' }}
        </button>
      </div>

      <div class="password-field">
        <input [type]="showPassword ? 'text' : 'password'" placeholder="Confirm Password"
          formControlName="confirmPassword" />
        <button type="button" class="toggle" (click)="showPassword=!showPassword">
          {{ showPassword ? 'Hide' : 'Show' }}
        </button>
      </div>


      <div class="strength">
        <div class="bar" [class.active]="strength>=1"></div>
        <div class="bar" [class.active]="strength>=2"></div>
        <div class="bar" [class.active]="strength>=3"></div>
        <div class="bar" [class.active]="strength>=4"></div>
        <div class="bar" [class.active]="strength>=5"></div>
      </div>

      <ul class="rules">
        <li [class.ok]="rules.lowercase">Lowercase letter</li>
        <li [class.ok]="rules.uppercase">Uppercase letter</li>
        <li [class.ok]="rules.number">Number</li>
        <li [class.ok]="rules.symbol">Special character</li>
        <li [class.ok]="rules.length">Minimum 8 characters</li>
        <li [class.ok]="passwordsMatch()">Passwords match</li>
      </ul>

      <button type="submit" [disabled]="!isValid() || loading">
        {{ loading ? 'Updating...' : 'Reset Password' }}
      </button>

    </form>
  </div>
</div>
