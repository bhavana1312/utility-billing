<div class="layout centered">
  <div class="auth-card">
    <div class="auth-header">
      <div class="icon-circle">🔑</div>
      <h2>Forgot Password</h2>
      <p>Enter your email and we'll send you a link to reset your password.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="input-group">
        <label>Email Address</label>
        <input type="email" placeholder="e.g. name@company.com" formControlName="email"
          [class.invalid]="form.get('email')?.touched && form.get('email')?.invalid" />

        <div class="error-text" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
          A valid email address is required
        </div>
      </div>

      <button type="submit" class="confirm-btn full-width" [disabled]="form.invalid || loading">
        {{ loading ? 'Sending Reset Link...' : 'Send Reset Link' }}
      </button>

      <div class="auth-footer">
        <a routerLink="/login" class="link">
          <span class="arrow">←</span> Back to Login
        </a>
      </div>
    </form>
  </div>
</div>
